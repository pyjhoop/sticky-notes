[package]
name = "sticky-notes"
version = "1.0.0"
description = "윈도우용 스티커 메모"
authors = ["sticky-notes"]
edition = "2021"
rust-version = "1.77.2"

# 라이브러리 이름. main.rs 와 lib.rs 가 함께 존재하므로 이름을 분리한다.
[lib]
name = "sticky_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.9.0"
# `update.rs` 의 대기(sleep)에만 쓴다. tauri 가 이미 tokio 위에 있으므로 추가 비용은 없다.
tokio = { version = "1", features = ["time"] }
uuid = { version = "1.20.0", features = ["v7", "serde"] }
window-vibrancy = "0.8.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
