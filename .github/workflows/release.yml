name: release

# main 에 푸시될 때마다 Windows 인스톨러를 빌드하고 태그 릴리스를 만든다.
# 사양 근거: plan.md "CI/CD — main 푸시마다 빌드 + 태그 릴리스"
#
# 단일 잡이다. 잡을 나누면 Rust 를 두 번 컴파일하게 된다(dev/release 프로파일 + 캐시 미스).
# 테스트·린트는 continue-on-error 로 둔다 — 실패를 눈에 보이게 하되 릴리스를 막지는 않는다.
# 개발 중에는 "다운로드 가능한 빌드가 항상 나온다"가 우선이다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # ── 검증 (실패해도 릴리스는 계속된다) ─────────────────────
      - name: 프론트 타입체크 + 번들
        run: npm run build

      - name: vitest
        continue-on-error: true
        run: npm test

      - name: cargo clippy
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        continue-on-error: true
        working-directory: src-tauri
        run: cargo test

      # ── 버전 주입 ───────────────────────────────────────────
      # main 푸시마다 단조 증가. 빌드 전에 세 파일에 써넣어
      # 인스톨러 파일명 / exe 메타데이터 / 태그가 전부 같은 값을 갖게 한다.
      # 이 변경은 커밋하지 않는다 — 러너 워크스페이스에만 반영된다.
      - name: 버전 결정
        id: ver
        shell: pwsh
        run: |
          # M7 이후 정식 릴리스 — 1.0.<run_number> (plan.md "CI/CD").
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          Write-Host "version = $version"

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          # package.json / tauri.conf.json — 최상위 "version" 은 각 파일에 하나뿐이다.
          foreach ($p in @('package.json', 'src-tauri/tauri.conf.json')) {
            $full = (Resolve-Path $p).Path
            $text = [System.IO.File]::ReadAllText($full)
            $text = [regex]::Replace(
              $text,
              '(?m)^(\s*"version"\s*:\s*)"[^"]*"',
              ('${1}"' + $version + '"'),
              1)
            [System.IO.File]::WriteAllText($full, $text, $utf8NoBom)
          }

          # Cargo.toml — [package] 의 version 만. 줄 시작에 걸리는 첫 항목 1개만 바꾼다
          # (의존성 버전은 `tauri = { version = ... }` 형태라 줄 시작이 아니다).
          $full = (Resolve-Path 'src-tauri/Cargo.toml').Path
          $text = [System.IO.File]::ReadAllText($full)
          $text = [regex]::Replace(
            $text,
            '(?m)^version\s*=\s*"[^"]*"',
            ('version = "' + $version + '"'),
            1)
          [System.IO.File]::WriteAllText($full, $text, $utf8NoBom)

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 버전 반영 확인
        shell: pwsh
        run: |
          $expected = '${{ steps.ver.outputs.version }}'
          $hits = @(
            (Select-String -Path package.json              -Pattern '"version"'   | Select-Object -First 1),
            (Select-String -Path src-tauri/tauri.conf.json -Pattern '"version"'   | Select-Object -First 1),
            (Select-String -Path src-tauri/Cargo.toml      -Pattern '^version'    | Select-Object -First 1)
          )
          $hits | ForEach-Object { Write-Host $_.Line.Trim() }
          foreach ($h in $hits) {
            if ($h.Line -notmatch [regex]::Escape($expected)) {
              throw "버전 주입 실패: '$($h.Line.Trim())' 에 $expected 가 없다"
            }
          }

      # ── 빌드 · 릴리스 ───────────────────────────────────────
      # tauri build 가 beforeBuildCommand 로 npm run build 를 다시 실행한다(1초대).
      #
      # 서명 키가 없으면 여기서 **바로 멈춘다.** 서명 없이 빌드하면 인스톨러는
      # 나오지만 `.sig` 가 없어 latest.json 을 만들 수 없고, 이미 배포된 앱은
      # "업데이트가 있다는데 설치가 안 되는" 상태가 된다. 조용히 넘어갈 일이 아니다.
      - name: 서명 키 확인
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            throw '저장소 Secrets 에 TAURI_SIGNING_PRIVATE_KEY 가 없다. 자동 업데이트용 서명 키를 등록하라.'
          }

      - name: NSIS 인스톨러 빌드 (+ 업데이터 서명)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: 산출물 확인
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          if (-not (Test-Path $dir)) { throw "NSIS 번들 디렉터리가 없다: $dir" }
          $files = @(Get-ChildItem $dir -Filter *.exe)
          if ($files.Count -eq 0) { throw 'NSIS 인스톨러(.exe)가 생성되지 않았다.' }
          $files | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,2)) MB" }

      # ── 업데이터 매니페스트 ─────────────────────────────────
      # `tauri.conf.json` 의 plugins.updater.endpoints 가 가리키는 파일을 만든다:
      #   https://github.com/<owner>/<repo>/releases/latest/download/latest.json
      # (`/releases/latest/` 는 prerelease 가 아닌 최신 릴리스로 리다이렉트된다)
      - name: latest.json 생성
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = @(Get-ChildItem $dir -Filter *-setup.exe)[0]
          if (-not $exe) { throw "NSIS setup exe 를 찾지 못했다: $dir" }

          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "서명 파일이 없다: $sigPath — bundle.createUpdaterArtifacts 와 서명 키를 확인하라."
          }
          $signature = (Get-Content $sigPath -Raw).Trim()

          # 파일명에 공백이 있다(productName = "Sticky Notes"). URL 로 쓰려면 인코딩해야 한다.
          $name = [System.Uri]::EscapeDataString($exe.Name)
          $tag  = '${{ steps.ver.outputs.tag }}'
          $url  = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"

          $manifest = [ordered]@{
            version   = '${{ steps.ver.outputs.version }}'
            notes     = "커밋 ${{ github.sha }} 자동 빌드"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{ signature = $signature; url = $url }
            }
          }

          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'latest.json'),
            $json,
            (New-Object System.Text.UTF8Encoding($false)))
          Write-Host $json

      - name: 릴리스 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          # 태그를 **빌드된 커밋**에 붙인다. 이걸 빼면 액션이 릴리스 생성 시점의
          # 기본 브랜치 끝에 태그를 달아, 자산과 태그가 서로 다른 코드를 가리킨다
          # (v0.1.3·v0.1.4가 같은 커밋에 붙고, v0.1.9는 빌드된 적 없는 [skip ci] 커밋에 붙었다).
          target_commitish: ${{ github.sha }}
          # M7 완료로 정식 릴리스 전환 (plan.md "CI/CD" 절).
          prerelease: false
          generate_release_notes: true
          body: |
            `main` 자동 빌드 — 커밋 ${{ github.sha }}

            > **정식 릴리스입니다.** 아래 NSIS 인스톨러(`.exe`)를 내려받아 설치하세요.
            > 설치는 사용자 단위(`currentUser`)이며 관리자 권한이 필요하지 않습니다.
            >
            > 이미 설치돼 있다면 앱이 알아서 이 버전을 찾아 설치를 제안합니다
            > (설정 창의 `UPDATE` 섹션에서 바로 확인할 수도 있습니다).
          # `.sig` 와 `latest.json` 은 자동 업데이트가 쓰는 자산이다. 빠지면 업데이트가 멈춘다.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
          fail_on_unmatched_files: true
